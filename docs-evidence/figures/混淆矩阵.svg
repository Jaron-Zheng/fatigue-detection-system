<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
<title>疲劳检出混淆矩阵与评价指标（按采样点计数）</title>
<rect width="860" height="430" fill="#ffffff"/>
<text x="430" y="28" font-size="17" fill="#1d1d1f" text-anchor="middle" font-weight="600">疲劳检出混淆矩阵与评价指标（按采样点计数）</text><text x="200" y="60" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600">系统判定</text><text x="135" y="78" font-size="12" fill="#515154" text-anchor="middle" font-weight="400">正常</text><text x="265" y="78" font-size="12" fill="#515154" text-anchor="middle" font-weight="400">疲劳</text><text x="30" y="151" font-size="13" fill="#1d1d1f" text-anchor="middle" font-weight="600" transform="rotate(-90 30 151)">人工标注</text><text x="58" y="155" font-size="12" fill="#515154" text-anchor="end" font-weight="400">正常</text><text x="58" y="285" font-size="12" fill="#515154" text-anchor="end" font-weight="400">疲劳</text><rect x="70" y="86" width="130" height="130" fill="rgba(20,106,56,0.39)" fill-opacity="1" stroke="#ffffff" stroke-width="1" rx="0"/><text x="135" y="145" font-size="12.5" fill="#1d1d1f" text-anchor="middle" font-weight="600">TN</text><text x="135" y="167" font-size="12" fill="#1d1d1f" text-anchor="middle" font-weight="400">48（16.8%）</text><rect x="200" y="86" width="130" height="130" fill="rgba(193,31,26,0.18)" fill-opacity="1" stroke="#ffffff" stroke-width="1" rx="0"/><text x="265" y="145" font-size="12.5" fill="#1d1d1f" text-anchor="middle" font-weight="600">FP 误报</text><text x="265" y="167" font-size="12" fill="#1d1d1f" text-anchor="middle" font-weight="400">6（2.1%）</text><rect x="70" y="216" width="130" height="130" fill="rgba(193,31,26,0.57)" fill-opacity="1" stroke="#ffffff" stroke-width="1" rx="0"/><text x="135" y="275" font-size="12.5" fill="#1d1d1f" text-anchor="middle" font-weight="600">FN 漏报</text><text x="135" y="297" font-size="12" fill="#1d1d1f" text-anchor="middle" font-weight="400">83（29.1%）</text><rect x="200" y="216" width="130" height="130" fill="rgba(20,106,56,0.90)" fill-opacity="1" stroke="#ffffff" stroke-width="1" rx="0"/><text x="265" y="275" font-size="12.5" fill="#1d1d1f" text-anchor="middle" font-weight="600">TP</text><text x="265" y="297" font-size="12" fill="#1d1d1f" text-anchor="middle" font-weight="400">148（51.9%）</text><text x="400" y="84" font-size="14" fill="#1d1d1f" text-anchor="start" font-weight="600">评价指标</text><text x="400" y="106" font-size="12" fill="#515154" text-anchor="start" font-weight="400">准确率 Accuracy</text><text x="660" y="106" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">68.8%</text><text x="400" y="132" font-size="12" fill="#515154" text-anchor="start" font-weight="400">灵敏度 Sensitivity</text><text x="660" y="132" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">64.1%</text><text x="400" y="158" font-size="12" fill="#515154" text-anchor="start" font-weight="400">特异度 Specificity</text><text x="660" y="158" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">88.9%</text><text x="400" y="184" font-size="12" fill="#515154" text-anchor="start" font-weight="400">查准率 Precision</text><text x="660" y="184" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">96.1%</text><text x="400" y="210" font-size="12" fill="#515154" text-anchor="start" font-weight="400">平衡准确率 Balanced Acc.</text><text x="660" y="210" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">76.5%</text><text x="400" y="236" font-size="12" fill="#515154" text-anchor="start" font-weight="400">F1 分数</text><text x="660" y="236" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">0.769</text><text x="400" y="262" font-size="12" fill="#515154" text-anchor="start" font-weight="400">Youden's J</text><text x="660" y="262" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">0.530</text><text x="400" y="288" font-size="12" fill="#515154" text-anchor="start" font-weight="400">MCC</text><text x="660" y="288" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">0.416</text><text x="400" y="314" font-size="12" fill="#515154" text-anchor="start" font-weight="400">漏报率 FNR</text><text x="660" y="314" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">35.9%</text><text x="400" y="340" font-size="12" fill="#515154" text-anchor="start" font-weight="400">误报率 FPR</text><text x="660" y="340" font-size="12.5" fill="#1d1d1f" text-anchor="end" font-weight="600">11.1%</text><text x="430" y="418" font-size="10.5" fill="#6e6e73" text-anchor="middle" font-weight="400">二分类口径：轻度及以上等级判为&quot;疲劳&quot;；指标值来自界面导出的&quot;按采样点计数&quot;列</text>
</svg>